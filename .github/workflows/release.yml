# GoPost Release Workflow
#
# Triggered when a version tag is pushed (e.g., v1.0.0).
# Produces proper native packages: macOS .app, Windows NSIS installer, Linux AppImage.
# Also builds standalone CLI binaries for all platforms.
#
# Users download the .dmg / .exe installer / .AppImage — double-click to run.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════
  #  macOS — .app bundle + .dmg
  # ═══════════════════════════════════════════════════════════
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails@latest

      - name: Install icon tools
        run: brew install librsvg

      - name: Generate app icons
        run: bash build/appicon/generate.sh

      - name: Install frontend deps
        run: cd frontend && npm install && cd ..

      - name: Build frontend
        run: cd frontend && npm run build && cd ..

      - name: Build macOS .app with Wails
        run: wails build
        env:
          CGO_ENABLED: 1

      - name: Create .dmg
        run: |
          mkdir -p dmg-root
          cp -R bin/GoPost.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "GoPost" -srcfolder dmg-root \
            -ov -format UDZO "bin/GoPost-${GITHUB_REF_NAME}-macOS.dmg"
          rm -rf dmg-root

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoPost-macOS-app
          path: bin/GoPost.app

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoPost-macOS-dmg
          path: bin/GoPost-*.dmg

  # ═══════════════════════════════════════════════════════════
  #  macOS CLI (separate, for CI runners)
  # ═══════════════════════════════════════════════════════════
  build-macos-cli:
    name: Build macOS CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build CLI
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost ./cmd/gopost/
          tar -czf gopost-darwin-arm64.tar.gz gopost
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-darwin-arm64
          path: gopost-darwin-arm64.tar.gz

  build-macos-cli-intel:
    name: Build macOS CLI (Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build CLI
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost ./cmd/gopost/
          tar -czf gopost-darwin-amd64.tar.gz gopost
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-darwin-amd64
          path: gopost-darwin-amd64.tar.gz

  # ═══════════════════════════════════════════════════════════
  #  Windows — .exe + NSIS installer
  # ═══════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails@latest
        shell: pwsh

      - name: Install ImageMagick (for icon)
        run: choco install imagemagick -y --no-progress
        shell: pwsh

      - name: Generate app icons
        run: |
          magick -background none -density 1024 build/appicon/icon.svg -resize 256x256 build/windows/icon.ico
        shell: pwsh

      - name: Install frontend deps
        run: cd frontend && npm install && cd ..
        shell: pwsh

      - name: Build frontend
        run: cd frontend && npm run build && cd ..
        shell: pwsh

      - name: Build Windows with Wails (NSIS installer)
        run: wails build
        shell: pwsh
        env:
          CGO_ENABLED: 1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GoPost-Windows-Installer
          path: bin/GoPost*.exe

  # ═══════════════════════════════════════════════════════════
  #  Windows CLI (standalone)
  # ═══════════════════════════════════════════════════════════
  build-windows-cli:
    name: Build Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build CLI
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost.exe ./cmd/gopost/
          Compress-Archive -Path gopost.exe -DestinationPath gopost-windows-amd64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-windows-amd64
          path: gopost-windows-amd64.zip

  # ═══════════════════════════════════════════════════════════
  #  Linux CLI
  # ═══════════════════════════════════════════════════════════
  build-linux-cli:
    name: Build Linux CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build CLI
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost ./cmd/gopost/
          tar -czf gopost-linux-${{ matrix.arch }}.tar.gz gopost
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-linux-${{ matrix.arch }}
          path: gopost-linux-${{ matrix.arch }}.tar.gz

  # ═══════════════════════════════════════════════════════════
  #  Create GitHub Release
  # ═══════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs:
      - build-macos
      - build-macos-cli
      - build-macos-cli-intel
      - build-windows
      - build-windows-cli
      - build-linux-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten and rename
        run: |
          mkdir -p release
          # Find all files and copy to release/
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.exe" \) | while read f; do
            # Skip NSIS uninstaller
            case "$f" in
              *uninst*) continue ;;
            esac
            cp "$f" release/
          done
          # Copy .app bundle
          if [ -d "dist/GoPost-macOS-app/GoPost.app" ]; then
            cp -R dist/GoPost-macOS-app/GoPost.app release/
            cd release && tar -czf GoPost-macOS-app.tar.gz GoPost.app && rm -rf GoPost.app && cd ..
          fi
          ls -la release/

      - name: Generate checksums
        run: |
          cd release && sha256sum * > checksums.txt && cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          body: |
            ## GoPost ${{ github.ref_name }}

            ### 🖥 Desktop App (double-click to run)

            | Platform | Download |
            |----------|----------|
            | **macOS** | `GoPost-*.dmg` — open, drag to Applications |
            | **Windows** | `GoPost-*-installer.exe` — run installer |

            ### ⌨ Command-Line Runner

            | Platform | Download |
            |----------|----------|
            | macOS Apple Silicon | `gopost-darwin-arm64.tar.gz` |
            | macOS Intel | `gopost-darwin-amd64.tar.gz` |
            | Linux x86_64 | `gopost-linux-amd64.tar.gz` |
            | Linux ARM64 | `gopost-linux-arm64.tar.gz` |
            | Windows x86_64 | `gopost-windows-amd64.zip` |

            ### 📦 Package Managers

            ```bash
            # Homebrew (macOS/Linux)
            brew tap berksunduri/gopost
            brew install gopost

            # Chocolatey (Windows)
            choco install gopost
            ```

            ### 🔑 Checksums
            See `checksums.txt` below.
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
