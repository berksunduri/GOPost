# GoPost Release Workflow
#
# Triggered when a version tag is pushed (e.g., v1.0.0).
# Produces proper native packages: macOS .dmg, Windows NSIS installer, Linux AppImage.
# Also builds standalone CLI binaries for all platforms.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════
  #  macOS — .app bundle + .dmg
  # ═══════════════════════════════════════════════════════════
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Generate app icons (uses built-in sips, no brew needed)
        run: bash build/appicon/generate.sh

      - name: Install frontend deps
        run: cd frontend && npm install && cd ..

      - name: Build frontend
        run: cd frontend && npm run build && cd ..

      - name: Build macOS binary
        run: go build -ldflags "-X main.version=${{ github.ref_name }}" -o bin/GoPost .
        env:
          CGO_ENABLED: 1

      - name: Create .app bundle
        run: |
          APP="bin/GoPost.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp bin/GoPost "$APP/Contents/MacOS/GoPost"

          # Info.plist
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>GoPost</string>
            <key>CFBundleIdentifier</key><string>com.gopost.app</string>
            <key>CFBundleName</key><string>GoPost</string>
            <key>CFBundleDisplayName</key><string>GoPost</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleIconFile</key><string>icon.icns</string>
          </dict>
          </plist>
          PLIST

          # Copy icon if it exists
          if [ -f build/darwin/icon.icns ]; then
            cp build/darwin/icon.icns "$APP/Contents/Resources/icon.icns"
          fi

          # Ad-hoc sign (prevents "damaged" error — users can Right-click → Open)
          codesign --deep --force --sign - "$APP"

          echo "Created $APP"

      - name: Create .dmg
        run: |
          APP="bin/GoPost.app"

          # ── Code sign .app (only if cert secret is set) ──
          if [ -n "$APPLE_DEVELOPER_CERT" ]; then
            echo "Signing with Apple Developer ID..."
            echo "$APPLE_DEVELOPER_CERT" | base64 -d > cert.p12
            security create-keychain -p temp build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p temp build.keychain
            security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
            codesign --deep --force --verify --verbose \
              --sign "Developer ID Application: $APPLE_TEAM_ID" \
              --options runtime \
              "$APP"
            rm -f cert.p12
          fi

          mkdir -p dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "GoPost" -srcfolder dmg-root \
            -ov -format UDZO "bin/GoPost-${{ github.ref_name }}-macOS.dmg"
          rm -rf dmg-root

          # ── Notarize .dmg (only if signed) ──
          if [ -n "$APPLE_DEVELOPER_CERT" ]; then
            echo "Submitting for notarization..."
            xcrun notarytool submit "bin/GoPost-${{ github.ref_name }}-macOS.dmg" \
              --apple-id "$APPLE_NOTARY_APPLE_ID" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "bin/GoPost-${{ github.ref_name }}-macOS.dmg"
            echo "Notarized."
          fi
        env:
          APPLE_DEVELOPER_CERT: ${{ secrets.APPLE_DEVELOPER_CERT }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoPost-macOS-dmg
          path: bin/GoPost-*.dmg

  # ═══════════════════════════════════════════════════════════
  #  macOS CLI (arm64 + amd64 from one runner)
  # ═══════════════════════════════════════════════════════════
  build-macos-cli:
    name: Build macOS CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build CLI (arm64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost ./cmd/gopost/
          tar -czf gopost-darwin-arm64.tar.gz gopost
      - name: Build CLI (amd64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost ./cmd/gopost/
          tar -czf gopost-darwin-amd64.tar.gz gopost
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-darwin-arm64
          path: gopost-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-darwin-amd64
          path: gopost-darwin-amd64.tar.gz

  # ═══════════════════════════════════════════════════════════
  #  Windows — .exe
  # ═══════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install icon + sign tools
        run: choco install imagemagick -y --no-progress
        shell: pwsh

      - name: Generate Windows icon
        run: |
          magick -background none -density 1024 build/appicon/icon.svg -resize 256x256 build/windows/icon-256.png
          magick build/windows/icon-256.png -define icon:auto-resize=256,64,48,32,16 build/windows/icon.ico
          echo "Icon created"
        shell: pwsh

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
        shell: pwsh

      - name: Generate .syso (version info + icon)
        run: goversioninfo -platform-specific build/windows/versioninfo.json
        shell: pwsh

      - name: Install frontend deps
        run: cd frontend && npm install && cd ..
        shell: pwsh

      - name: Build frontend
        run: cd frontend && npm run build && cd ..
        shell: pwsh

      - name: Build Windows binary
        run: |
          $env:CGO_ENABLED = "1"
          go build -ldflags "-X main.version=${{ github.ref_name }} -H windowsgui" -o bin/GoPost.exe .
        shell: pwsh

      # ── Code sign (only if cert secret is set) ──
      - name: Setup code signing cert
        if: env.WINDOWS_SIGNING_CERT != ''
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT)
          [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}

      - name: Sign binary
        if: env.WINDOWS_SIGNING_CERT != ''
        run: |
          signtool sign /fd SHA256 /f cert.pfx /p $env:WINDOWS_SIGNING_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 `
            bin/GoPost.exe
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoPost-Windows-exe
          path: bin/GoPost.exe

  # ═══════════════════════════════════════════════════════════
  #  Windows CLI
  # ═══════════════════════════════════════════════════════════
  build-windows-cli:
    name: Build Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build CLI
        run: |
          $env:GOOS = "windows"; $env:GOARCH = "amd64"
          go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost.exe ./cmd/gopost/
          Compress-Archive -Path gopost.exe -DestinationPath gopost-windows-amd64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-windows-amd64
          path: gopost-windows-amd64.zip

  # ═══════════════════════════════════════════════════════════
  #  Linux CLI
  # ═══════════════════════════════════════════════════════════
  build-linux-cli:
    name: Build Linux CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build CLI
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} go build -ldflags "-X main.version=${{ github.ref_name }}" -o gopost ./cmd/gopost/
          tar -czf gopost-linux-${{ matrix.arch }}.tar.gz gopost
      - uses: actions/upload-artifact@v4
        with:
          name: gopost-linux-${{ matrix.arch }}
          path: gopost-linux-${{ matrix.arch }}.tar.gz

  # ═══════════════════════════════════════════════════════════
  #  Create GitHub Release
  # ═══════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs:
      - build-macos
      - build-macos-cli
      - build-windows
      - build-windows-cli
      - build-linux-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten and rename
        run: |
          mkdir -p release
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.exe" \) | while read f; do
            case "$f" in
              *uninst*) continue ;;
            esac
            cp "$f" release/
          done
          ls -la release/

      - name: Generate checksums
        run: |
          cd release && sha256sum * > checksums.txt && cat checksums.txt

      # Notes live in docs/releases/<tag>.md (written by scripts/release.sh).
      # Title comes from: <!-- title: vX.Y.Z — keywords -->
      - name: Resolve release notes
        id: notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing $NOTES — run scripts/release.sh prepare first"
            exit 1
          fi
          TITLE=$(sed -n 's/^<!-- title: \(.*\) -->$/\1/p' "$NOTES" | head -1)
          if [ -z "$TITLE" ]; then
            TITLE="$GITHUB_REF_NAME"
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Using notes: $NOTES"
          echo "Release title: $TITLE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ steps.notes.outputs.path }}
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
