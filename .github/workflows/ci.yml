name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        # app/ no longer imports Wails; App façade tests run in CI.
        # Coverage gate applies to app/pkg (business logic). App is a thin façade
        # over pkg + OS/Wails edges — tested for behavior, not statement %.
        # main_test.go stays behind //go:build integration (HTTP router in main).
        run: |
          go test ./app/pkg/... -race -timeout 120s \
            -coverprofile=coverage.out -covermode=atomic
          go test ./app -race -timeout 120s
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$NF); print $NF}')
          echo "pkg coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 84) { print "coverage " t "% below 84% gate"; exit 1 } }'

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: frontend
