# GoPost API Tests — GitHub Action
#
# Runs a GoPost collection in CI and uploads JUnit test results.
#
# Usage:
#   - uses: berksunduri/GoPost/.github/actions/run-collection@main
#     with:
#       collection: checkout-api
#       data_dir: .
#       environment: ci
name: "GoPost API Tests"
description: "Run API tests with GoPost and upload results"
inputs:
  collection:
    description: "Collection id/slug/name, collection directory, or .http file"
    required: true
  data_dir:
    description: "Workspace root containing collections/ and environments/"
    required: false
    default: "."
  environment:
    description: "Environment name (optional)"
    required: false
  env_file:
    description: "Path to environment .gopost.json file (optional)"
    required: false
  reporter:
    description: "Reporter format: console, junit, json"
    required: false
    default: "junit"
  parallel:
    description: "Number of parallel workers"
    required: false
    default: "1"
  timeout:
    description: "Per-request timeout (e.g., 30s, 1m)"
    required: false
    default: "30s"
  stop_on_fail:
    description: "Stop on first failure"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.x"

    - name: Install GoPost CLI
      shell: bash
      run: |
        if [ -f "${{ github.action_path }}/../../../cmd/gopost/main.go" ]; then
          go build -o "$RUNNER_TEMP/gopost" "${{ github.action_path }}/../../../cmd/gopost"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        else
          go install github.com/berksunduri/GoPost/cmd/gopost@latest
        fi

    - name: Run collection
      shell: bash
      run: |
        ARGS=(run --data-dir "${{ inputs.data_dir }}" "${{ inputs.collection }}")
        if [ -n "${{ inputs.env_file }}" ]; then
          ARGS+=(--env-file "${{ inputs.env_file }}")
        elif [ -n "${{ inputs.environment }}" ]; then
          ARGS+=(--env "${{ inputs.environment }}")
        fi
        ARGS+=(--reporter "${{ inputs.reporter }}" --output test-results.xml)
        ARGS+=(--parallel "${{ inputs.parallel }}" --timeout "${{ inputs.timeout }}")
        if [ "${{ inputs.stop_on_fail }}" = "true" ]; then
          ARGS+=(--stop-on-fail)
        fi
        gopost "${ARGS[@]}"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results
        path: test-results.xml
