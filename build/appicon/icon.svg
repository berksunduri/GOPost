<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Stylized "G" -->
  <g transform="translate(512,512)">
    <!-- Outer ring (send button motif) -->
    <circle r="340" fill="none" stroke="#00d4ff" stroke-width="48" opacity="0.9"/>
    <!-- Inner arrow (play/send) -->
    <path d="M-120 0 L180 0" stroke="#00d4ff" stroke-width="52" stroke-linecap="round" opacity="0.9"/>
    <polygon points="180,-80 300,0 180,80" fill="#00d4ff" opacity="0.9"/>
    <!-- Small "post" indicator dots -->
    <circle cx="360" cy="300" r="24" fill="#00d4ff" opacity="0.4"/>
    <circle cx="420" cy="260" r="18" fill="#00d4ff" opacity="0.25"/>
    <circle cx="380" cy="200" r="14" fill="#00d4ff" opacity="0.15"/>
  </g>
</svg>
