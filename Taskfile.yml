version: '3'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "GoPost"
  BIN_DIR: "bin"
  VITE_PORT: "34115"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  build:cli:
    summary: Builds just the CLI binary
    cmds:
      - task: common:build:cli

  build:all:
    summary: Builds both GUI app and CLI binary
    cmds:
      - task: "{{OS}}:build"
      - task: common:build:cli

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  release:
    summary: "Release helper (prepare | ship | next). Example: task release -- prepare 1.10.0 \"keywords\""
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}}
